[project]
name = "jagan"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "rich>=13",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
]

[project.scripts]
jagan = "jagan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"